# Local synthetic site only. Never expose the demo credentials on a public host.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp
      MYSQL_PASSWORD: wp
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./.data/db:/var/lib/mysql

  wordpress:
    image: wordpress:7.1.3-php8.3-apache
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "true"
    ports:
      - "127.0.0.1:${WP_PORT:-8080}:80"
    volumes:
      - ./.data/wordpress:/var/www/html
      - ./plugin:/var/www/html/wp-content/plugins/jazzbb-wp:ro
      - ./theme/nothing-burger:/var/www/html/wp-content/themes/nothing-burger:ro

  wp:
    image: wordpress:cli-php8.3
    depends_on:
      - db
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - ./.data/wordpress:/var/www/html
      - ./plugin:/var/www/html/wp-content/plugins/jazzbb-wp:ro
      - ./theme/nothing-burger:/var/www/html/wp-content/themes/nothing-burger:ro
